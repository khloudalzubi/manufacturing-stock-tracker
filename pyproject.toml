[project]
name = "manufacturing-stock-tracker"
version = "0.1.0"
description = "Collect and process Twelve Data quote data for manufacturing companies."
readme = "README.md"
authors = [
    { name = "Khloud alZubi", email = "kha0010@auburn.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.60.0",
]

[project.scripts]
manufacturing-stock-tracker = "manufacturing_stock_tracker:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]
